name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            office -> target
            src-tauri -> target
          shared-key: callio

      - name: Install JavaScript packages
        run: npm ci

      - name: Build the office engine (Word, Excel, PowerPoint, PDF, pictures)
        run: cargo build --release --locked --manifest-path office/Cargo.toml

      - name: Stage the office engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force office/bin | Out-Null
          Copy-Item office/target/release/callio-office.exe office/bin/

      - name: Build Callio and the installer
        run: npx tauri build --bundles nsis

      - name: Package the zips
        id: pkg
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $out = "out"
          $port = "$out/Callio-portable"
          New-Item -ItemType Directory -Force $port | Out-Null
          Copy-Item src-tauri/target/release/Callio.exe, office/bin/callio-office.exe $port/
          if (Test-Path src-tauri/target/release/WebView2Loader.dll) { Copy-Item src-tauri/target/release/WebView2Loader.dll $port/ }
          (Get-Content packaging/READ-ME.txt -Raw).Replace('{{VERSION}}', $v) | Set-Content -NoNewline -Encoding utf8 "$port/READ-ME.txt"
          Compress-Archive -Path "$port/*" -DestinationPath "$out/Callio-$v-portable.zip" -CompressionLevel Optimal
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $sdir = "$out/Callio-setup"
          New-Item -ItemType Directory -Force $sdir | Out-Null
          Copy-Item $setup.FullName $sdir/
          Copy-Item "$port/READ-ME.txt" $sdir/
          Compress-Archive -Path "$sdir/*" -DestinationPath "$out/Callio-$v-setup.zip" -CompressionLevel Optimal
          Get-ChildItem $out/*.zip | Format-Table Name, Length
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Callio-${{ steps.pkg.outputs.version }}-portable
          path: out/Callio-${{ steps.pkg.outputs.version }}-portable.zip
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: Callio-${{ steps.pkg.outputs.version }}-setup
          path: out/Callio-${{ steps.pkg.outputs.version }}-setup.zip
          compression-level: 0

      - name: Release notes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          # this version's section of CHANGELOG.md
          $v = "${{ steps.pkg.outputs.version }}"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($v))\b" | Select-Object -First 1).LineNumber
          $body = @("**Callio – Shape your folio**", "")
          if ($start) {
            for ($i = $start; $i -lt $lines.Count -and $lines[$i] -notmatch '^## '; $i++) { $body += $lines[$i] }
          }
          $body += @("", "**Downloads**", "- ``Callio-$v-setup.zip`` — the installer (per-user, no admin rights).", "- ``Callio-$v-portable.zip`` — unzip anywhere and run ``Callio.exe`` (keep ``callio-office.exe`` next to it).", "", "Windows SmartScreen may warn because the exe isn't code-signed: More info → Run anyway.")
          $body -join "`n" | Set-Content -Encoding utf8 out/RELEASE.md

      # A push to main publishes (or refreshes) the release of the version in package.json; the
      # tag v<version> is created on that commit. Pushing a tag v* does the same.
      - name: Publish the GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Callio ${{ steps.pkg.outputs.version }}
          body_path: out/RELEASE.md
          make_latest: true
          files: |
            out/Callio-${{ steps.pkg.outputs.version }}-portable.zip
            out/Callio-${{ steps.pkg.outputs.version }}-setup.zip
